<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" width="1920" height="600">
  <!-- Sky / background gradient -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="60%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="doorShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="topFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#0a0a0a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="600" fill="url(#sky)"/>

  <!-- Driveway surface -->
  <rect x="280" y="490" width="1360" height="110" rx="2" fill="#1c1c1c"/>
  <rect x="280" y="490" width="1360" height="3" fill="#2a2a2a"/>

  <!-- Garage structure / wall -->
  <rect x="260" y="60" width="1400" height="450" fill="#1e1e1e"/>
  <!-- Siding lines -->
  <g stroke="#2a2a2a" stroke-width="1" opacity="0.7">
    <line x1="260" y1="120" x2="1660" y2="120"/>
    <line x1="260" y1="150" x2="1660" y2="150"/>
    <line x1="260" y1="180" x2="1660" y2="180"/>
    <line x1="260" y1="210" x2="1660" y2="210"/>
  </g>

  <!-- Main garage door frame -->
  <rect x="380" y="130" width="1160" height="380" rx="3" fill="#141414" stroke="#2d2d2d" stroke-width="3"/>

  <!-- Door tracks (side rails) -->
  <rect x="378" y="130" width="12" height="380" fill="#222"/>
  <rect x="1530" y="130" width="12" height="380" fill="#222"/>

  <!-- Garage door panels — 4 rows of 4 sections each -->
  <!-- Row 1: y 135-225 -->
  <g fill="#1a1a1a" stroke="#2c2c2c" stroke-width="1.5">
    <!-- Row 1 panels -->
    <rect x="392" y="135" width="278" height="88" rx="1"/>
    <rect x="676" y="135" width="278" height="88" rx="1"/>
    <rect x="960" y="135" width="278" height="88" rx="1"/>
    <rect x="1244" y="135" width="278" height="88" rx="1"/>
    <!-- Row 2 panels -->
    <rect x="392" y="228" width="278" height="88" rx="1"/>
    <rect x="676" y="228" width="278" height="88" rx="1"/>
    <rect x="960" y="228" width="278" height="88" rx="1"/>
    <rect x="1244" y="228" width="278" height="88" rx="1"/>
    <!-- Row 3 panels -->
    <rect x="392" y="321" width="278" height="88" rx="1"/>
    <rect x="676" y="321" width="278" height="88" rx="1"/>
    <rect x="960" y="321" width="278" height="88" rx="1"/>
    <rect x="1244" y="321" width="278" height="88" rx="1"/>
    <!-- Row 4 panels -->
    <rect x="392" y="414" width="278" height="88" rx="1"/>
    <rect x="676" y="414" width="278" height="88" rx="1"/>
    <rect x="960" y="414" width="278" height="88" rx="1"/>
    <rect x="1244" y="414" width="278" height="88" rx="1"/>
  </g>

  <!-- Panel highlights (subtle top edge sheen on each panel) -->
  <g fill="#2a2a2a" opacity="0.5">
    <rect x="393" y="136" width="276" height="3"/>
    <rect x="677" y="136" width="276" height="3"/>
    <rect x="961" y="136" width="276" height="3"/>
    <rect x="1245" y="136" width="276" height="3"/>
    <rect x="393" y="229" width="276" height="3"/>
    <rect x="677" y="229" width="276" height="3"/>
    <rect x="961" y="229" width="276" height="3"/>
    <rect x="1245" y="229" width="276" height="3"/>
    <rect x="393" y="322" width="276" height="3"/>
    <rect x="677" y="322" width="276" height="3"/>
    <rect x="961" y="322" width="276" height="3"/>
    <rect x="1245" y="322" width="276" height="3"/>
    <rect x="393" y="415" width="276" height="3"/>
    <rect x="677" y="415" width="276" height="3"/>
    <rect x="961" y="415" width="276" height="3"/>
    <rect x="1245" y="415" width="276" height="3"/>
  </g>

  <!-- Door bottom seal -->
  <rect x="380" y="502" width="1160" height="8" fill="#0d0d0d" rx="1"/>

  <!-- Red accent stripe on door bottom -->
  <rect x="380" y="508" width="1160" height="3" fill="#c8002a" opacity="0.8"/>

  <!-- Overhead structure / torsion spring area -->
  <rect x="370" y="105" width="1180" height="28" fill="#1a1a1a" stroke="#2d2d2d" stroke-width="1"/>
  <!-- Spring shaft -->
  <rect x="380" y="112" width="1160" height="8" fill="#222" rx="2"/>
  <!-- Torsion spring coils (decorative) -->
  <g stroke="#333" stroke-width="2" fill="none">
    <path d="M500,112 Q510,108 520,112 Q530,116 540,112 Q550,108 560,112 Q570,116 580,112 Q590,108 600,112 Q610,116 620,112 Q630,108 640,112 Q650,116 660,112 Q670,108 680,112 Q690,116 700,112 Q710,108 720,112 Q730,116 740,112"/>
    <path d="M1180,112 Q1190,108 1200,112 Q1210,116 1220,112 Q1230,108 1240,112 Q1250,116 1260,112 Q1270,108 1280,112 Q1290,116 1300,112 Q1310,108 1320,112 Q1330,116 1340,112 Q1350,108 1360,112 Q1370,116 1380,112 Q1390,108 1400,112 Q1410,116 1420,112"/>
  </g>

  <!-- Left column of garage -->
  <rect x="260" y="60" width="120" height="450" fill="#1c1c1c"/>
  <rect x="350" y="60" width="30" height="450" fill="#1a1a1a"/>

  <!-- Right column -->
  <rect x="1540" y="60" width="120" height="450" fill="#1c1c1c"/>
  <rect x="1540" y="60" width="30" height="450" fill="#1a1a1a"/>

  <!-- Subtle side-shade overlay on door -->
  <rect x="380" y="130" width="1160" height="380" fill="url(#doorShade)"/>

  <!-- Overall cinematic fade overlay -->
  <rect width="1920" height="600" fill="url(#topFade)"/>
</svg>
